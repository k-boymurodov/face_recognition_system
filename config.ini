[camera]
width = 640
height = 480

[recognition]
# Yuzni taqqoslash chegarasi. Qiymat qancha past bo'lsa, aniqlik shuncha yuqori bo'ladi.
# Tavsiya etilgan qiymat: 0.45 dan 0.55 gacha.
tolerance = 0.5

# Ro'yxatga olishda yuz kodini aniqroq hisoblash uchun (yuqori qiymat sekinroq, lekin aniqroq)
registration_jitters = 10

# Ro'yxatga olish uchun nechta kadr yig'ish kerakligi
registration_frames = 15

[performance]
# Kadrni qayta ishlash (har nechanchi kadrda bir). 2 - har ikkinchi kadr.
process_every_n_frame = 2

# Yuzni aniqlash uchun kadr o'lchamini kichraytirish. 0.25 = 4 marta.
frame_resize_factor = 0.25

# Yuzni aniqlash modeli: 'hog' (tezroq, CPU) yoki 'cnn' (aniqroq, GPU talab qiladi)
# Agar GPU (NVIDIA) bo'lmasa, 'hog' dan foydalaning.
detection_model = hog

[alerts]
# Bir xodim uchun qayta tanish orasidagi minimal vaqt (sekund)
recognition_cooldown = 10
# Noma'lum shaxs uchun ogohlantirish yuborish orasidagi minimal vaqt (sekund)
unknown_person_alert_cooldown = 30